name: KOROS Governance
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  governance-docs:
    name: governance-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show Node version
        run: node --version
      - name: Validate fixture positives and negatives
        run: node .github/scripts/check-docs.mjs --self-test
      - name: Validate repository Markdown links and obvious credential patterns
        run: node .github/scripts/check-docs.mjs
