name: KOROS M02 Baseline
on:
  pull_request:
    paths:
      - package.json
      - .gitignore
      - src/**
      - scripts/**
      - test/**
      - .github/workflows/koros-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m02-baseline:
    name: m02-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Print toolchain
        run: node --version && npm --version
      - name: Syntax-only lint
        run: npm run lint
      - name: Unit and local HTTP smoke tests
        run: npm test
      - name: Build baseline validation
        run: npm run build
      - name: Local-only smoke
        run: npm run smoke
