name: KOROS Application CI
on:
  pull_request:
    paths:
      - package.json
      - .gitignore
      - src/**
      - scripts/**
      - test/**
      - .github/workflows/koros-baseline.yml
  push:
    branches: [main]
    paths:
      - package.json
      - .gitignore
      - src/**
      - scripts/**
      - test/**
      - .github/workflows/koros-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: koros-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  m02-baseline:
    name: m02-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Toolchain
        run: node --version && npm --version
      - name: Fail-closed source and dependency integrity
        run: npm run ci:integrity
      - name: Syntax-only lint (NOT a typecheck)
        run: npm run lint
      - name: Unit and negative integration tests
        run: npm test
      - name: Baseline syntax build (NOT deploy artifact)
        run: npm run build
      - name: Local-only HTTP smoke
        run: npm run smoke

  codeql-js:
    name: codeql-js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL JavaScript
        uses: github/codeql-action/init@fe4161a26a8629af62121b670040955b330f9af2 # v4.31.6
        with:
          languages: javascript-typescript
      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@fe4161a26a8629af62121b670040955b330f9af2 # v4.31.6
